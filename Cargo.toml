[package]
name = "ircgm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Direct-style async/await IRC game master and interactive bot library"

[features]
# `ircgm::testing`: the in-memory `test_harness` / `TestServer` for test suites.
testing = []

[dependencies]
fastrand = "2"
futures-util = "0.3"
irc = "1"
irc-colors = { git = "https://github.com/seirl/irc-colors", features = ["format"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
futures = "0.3"
ircgm = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["test-util", "macros", "rt", "net", "io-util"] }
tracing-subscriber = "0.3"
